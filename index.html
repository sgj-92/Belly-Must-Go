function openLogChooser() {
  if (!me()) { openWho(); return; }
  openSheet(`<h2>To battle</h2><p class="lead">What are we carving into the record?</p>
    <div class="choice"><button data-act="log-weight"><span>⚖️</span>Weigh-in</button><button data-act="log-steps"><span>🥾</span>March</button></div>`);
}

function openLogWeight(date = today()) {
  const m = me(); if (!m) { openWho(); return; }
  const mine = state.weighins.filter(e => e.pid === m.id).sort((a, b) => a.date < b.date ? -1 : 1);
  const existing = d => mine.find(e => e.date === d);
  const prefill = d => existing(d)?.kg ?? mine.filter(e => e.date < d).pop()?.kg ?? null;
  const formHtml = d => `<div class="field"><label for="lw-date">Date</label><input id="lw-date" type="date" name="date" value="${d}" max="${today()}"></div>
    <div class="field"><span class="lab">Weight</span><div id="lw-w">${weightInput("w", prefill(d))}</div>
    <div class="hint">${existing(d) ? "You already logged this day — saving replaces it." : "Same time, same scales — first thing, before you eat."}</div></div>`;
  openSheet(`<h2>⚖️ Face the scales</h2><p class="lead">The scales do not lie.</p><form id="lw">${formHtml(date)}<p class="err" id="lw-err"></p>
    <div class="btn-row"><button class="btn primary" type="submit">Carve it in stone</button></div></form>`, body => {
    const f = $("#lw", body);
    f.date.addEventListener("change", () => { const d = f.date.value; if (d) { $("#lw-w").innerHTML = weightInput("w", prefill(d)); $("#lw .hint").textContent = existing(d) ? "You already logged this day — saving replaces it." : "Same time, same scales — first thing, before you eat."; } });
    f.addEventListener("submit", async e => {
      e.preventDefault();
      const d = f.date.value, kg = readWeight(f, "w");
      if (!d || d > today()) { $("#lw-err").textContent = "Pick a date that isn't in the future."; return; }
      if (kg == null || kg < 30 || kg > 350) { $("#lw-err").textContent = "That weight doesn't look right."; return; }
      const prev = mine.filter(x => x.date < d).pop();
      const delta = prev ? kg - prev.kg : null;
      const msg = delta == null ? "Carved in stone ⚔️" : delta < -0.004 ? `${fmtDelta(delta)} carved off. Strength and honour ⚔️` : delta > 0.004 ? `${fmtDelta(delta)}. Rocky got back up. So will you 🥊` : "Held the line. Keep pushing.";
      if (await safe(store.saveWeighin({ id: `${m.id}_${d}`, pid: m.id, date: d, kg, ts: Date.now() }), msg)) closeSheet();
    });
  });
}

function openLogSteps(date = today()) {
  const m = me(); if (!m) { openWho(); return; }
  const goal = state.group.stepGoal;
  const existing = d => state.steps.find(e => e.pid === m.id && e.date === d);
  openSheet(`<h2>🥾 Log the march</h2><p class="lead">The legion marches <b>${fmtInt(goal)}</b> steps a day. Copy the number from your phone or watch.</p>
    <form id="ls"><div class="field"><label for="ls-date">Date</label><input id="ls-date" type="date" name="date" value="${date}" max="${today()}"></div>
    <div class="field"><label for="ls-n">Steps marched</label><input id="ls-n" class="big" type="number" inputmode="numeric" name="steps" min="0" max="150000" value="${existing(date)?.steps ?? ""}" placeholder="0">
    <div class="hint" id="ls-hint">${existing(date) ? "Already logged — saving replaces it." : "Update it as the day goes on; the latest number wins."}</div></div>
    <p class="err" id="ls-err"></p><div class="btn-row"><button class="btn primary" type="submit">Log the march</button></div></form>`, body => {
    const f = $("#ls", body);
    f.date.addEventListener("change", () => { const ex = existing(f.date.value); f.steps.value = ex?.steps ?? ""; $("#ls-hint").textContent = ex ? "Already logged — saving replaces it." : "Update it as the day goes on; the latest number wins."; });
    f.addEventListener("submit", async e => {
      e.preventDefault();
      const d = f.date.value, n = parseInt(f.steps.value, 10);
      if (!d || d > today()) { $("#ls-err").textContent = "Pick a date that isn't in the future."; return; }
      if (isNaN(n) || n < 0 || n > 150000) { $("#ls-err").textContent = "Enter a step count between 0 and 150,000."; return; }
      const msg = n >= goal * 2 ? "Double the march. Spartan 🔥" : n >= goal ? "The line holds. Goal hit 🛡️" : `${fmtInt(goal - n)} short. Keep marching 🥾`;
      if (await safe(store.saveSteps({ id: `${m.id}_${d}`, pid: m.id, date: d, steps: n, ts: Date.now() }), msg)) closeSheet();
    });
  });
}

function openPlayer(id) {
  const p = player(id); if (!p) return;
  if (id === meId) { go("me"); return; }
  const C = compute(), x = C.stats[id];
  const seeW = canSeeWeight(p);
  const t = tierOf(x.chgPct);
  openSheet(`<div class="me-top"><div class="me-statue">${torsoSVG(t.i, { variant: C.ranks.overall[id] === 1 ? "gold" : "plaster", cracked: !!(x.week && x.week.pct > 0), uid: "ps" })}</div>
    <div style="flex:1;min-width:0"><h2>${esc(p.emoji)} ${name(p)}</h2><div style="margin:4px 0 3px"><span class="tier t${t.i}">${esc(t.name)}</span></div>
    <div class="me-sub">Rank ${roman(C.ranks.overall[id])} · ${x.points} glory</div></div></div>
    <div class="stat-grid">
      <div class="stat"><b class="num ${tone(x.chgPct)}">${fmtPct(x.chgPct)}</b><span>Body %</span></div>
      <div class="stat"><b class="num ${tone(x.chgKg)}">${fmtDelta(x.chgKg)}</b><span>Change</span></div>
      <div class="stat"><b class="num ${tone(x.week?.pct)}">${fmtPct(x.week?.pct)}</b><span>This battle</span></div>
      <div class="stat"><b class="num">${seeW ? fmtWeight(x.curKg) : "🔒"}</b><span>Current</span></div>
      <div class="stat"><b class="num">${x.goalStreak} 🔥</b><span>Montage</span></div>
      <div class="stat"><b class="num">${fmtInt(x.stepsAvg)}</b><span>Avg march</span></div>
    </div>
    <div class="chart" id="chartPlayer" data-pid="${esc(id)}" style="margin-top:14px"></div>
    <div class="btn-row">${meId ? `<button class="btn" data-act="compare-go" data-id="${esc(id)}">⚔️ Face off</button>` : ""}<button class="btn" data-act="close">Close</button></div>
    <div style="margin-top:14px">${historyCard(id, false)}</div>`, () => mountCharts(C));
}

function openGroupSettings() {
  const g = state.group;
  openSheet(`<h2>Campaign & march goal</h2><p class="lead">These bind the whole legion — agree it in the group chat first.</p>
    <form id="gs"><div class="field"><label for="gs-name">Group name</label><input id="gs-name" type="text" name="name" maxlength="30" value="${esc(g.name)}"></div>
    <div class="field"><label for="gs-goal">Daily march goal (steps)</label><input id="gs-goal" type="number" inputmode="numeric" name="goal" min="1000" max="50000" step="500" value="${g.stepGoal}"></div>
    <div class="field"><label for="gs-start">Campaign start date</label><input id="gs-start" type="date" name="start" value="${g.startDate}">
      <div class="hint">Only weigh-ins and steps from this date count. Everyone's baseline is their first weigh-in on or after it. Move it forward to start a fresh campaign — old entries are kept.</div></div>
    <p class="err" id="gs-err"></p><div class="btn-row"><button class="btn primary" type="submit">Save for everyone</button></div></form>`, body => {
    $("#gs", body).addEventListener("submit", async e => {
      e.preventDefault();
      const f = e.target, goal = parseInt(f.goal.value, 10);
      if (isNaN(goal) || goal < 1000 || goal > 50000) { $("#gs-err").textContent = "Step goal must be 1,000–50,000."; return; }
      if (!f.start.value) { $("#gs-err").textContent = "Pick a start date."; return; }
      if (await safe(store.saveGroup({ name: f.name.value.trim() || "Belly Must Go", stepGoal: goal, startDate: f.start.value }), "Decreed for the legion")) closeSheet();
    });
  });
}

function openPointsInfo() {
  openSheet(`<h2>The laws of glory</h2><p class="lead">Glory rewards carving weight <i>and</i> turning up. Weight is scored as a % of your own starting weight, so a 70kg and a 130kg warrior fight on level ground.</p>
    <ul class="rules">
      <li><span>Every 1% of body weight carved off</span><b>+${POINTS.perPct}</b></li>
      <li><span>Every 1% gained back</span><b style="color:var(--bad)">−${POINTS.perPct}</b></li>
      <li><span>Each day you hit the march goal</span><b>+${POINTS.perGoalDay}</b></li>
      <li><span>Each battle (week) you face the scales</span><b>+${POINTS.perWeighWeek}</b></li>
      <li><span>Champion of the battle (biggest % drop)</span><b>+${POINTS.perWeeklyWin}</b></li>
    </ul>
    <div class="card-h" style="margin:18px 0 8px"><h2>Warrior ranks</h2><span class="meta">% of body weight lost</span></div>
    <div class="tiers">${TIERS.map(([n, at], i) => `<div>${torsoSVG(i, { uid: "tl" + i })}<b>${n}</b>${i === 0 ? "Start" : at + "%+"}</div>`).join("")}</div>
    <p class="faint" style="font-size:.82rem;margin-top:14px">Battles run Monday–Sunday. A battle's change is your last weigh-in that week against your last weigh-in before it. The biggest drop is crowned Champion 🌿; the biggest gain gets the thumbs down 👎 and a cracked statue. Arrows on the ranks show movement versus 7 days ago.</p>
    <div class="btn-row"><button class="btn" data-act="close">Strength and honour</button></div>`);
}

/* ---------------------------------------------------------------------
   Routing + events
   --------------------------------------------------------------------- */
let route = (location.hash.slice(1) || "home");
if (!["home", "boards", "trends", "me"].includes(route)) route = "home";
function go(r) { route = r; history.replaceState(null, "", "#" + r); closeSheet(); render(); window.scrollTo({ top: 0 }); }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-route],[data-act]");
  if (!t) return;
  if (t.dataset.route) { if (t.dataset.board) board = t.dataset.board; go(t.dataset.route); return; }
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case "log": openLogChooser(); break;
    case "log-weight": openLogWeight(); break;
    case "log-steps": openLogSteps(); break;
    case "player": openPlayer(id); break;
    case "board": board = t.dataset.board; render(); break;
    case "steps-range": stepsRange = t.dataset.range; render(); break;
    case "compare": compareId = id === meId || id === compareId ? null : id; render(); break;
    case "compare-go": compareId = id; showTable = false; go("trends"); break;
    case "chart-table": showTable = !showTable; render(); break;
    case "unit": unit = t.dataset.unit; prefs.set("unit", unit); render(); break;
    case "who": spectator = false; openWho(); break;
    case "pick-me": pickMe(id); break;
    case "join": openJoin(); break;
    case "spectate": spectator = true; closeSheet(); render(); break;
    case "edit-profile": openEditProfile(); break;
    case "group-settings": openGroupSettings(); break;
    case "points-info": openPointsInfo(); break;
    case "close": closeSheet(); break;
    case "feed-more": feedAll = !feedAll; render(); break;
    case "edit-weigh": openLogWeight(t.dataset.date); break;
    case "edit-steps": openLogSteps(t.dataset.date); break;
    case "del-weigh": if (confirm("Delete this weigh-in?")) safe(store.deleteWeighin(id), "Weigh-in deleted"); break;
    case "del-steps": if (confirm("Delete this step entry?")) safe(store.deleteSteps(id), "Steps deleted"); break;
    case "reset-demo": if (!LIVE && confirm("Reset the training grounds back to the sample legion?")) { prefs.del(ME_KEY); meId = null; spectator = false; store.reset(); } break;
  }
});

let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => state.ready && mountCharts(compute()), 150); });
// roll over to a new day if the app is left open past midnight
let lastDay = today();
document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });

(async () => {
  render();
  try {
    store = LIVE ? await makeFirestoreStore(render) : makeDemoStore(render);
  } catch (err) {
    console.error(err);
    $("#view").innerHTML = `<div class="card"><h2>Couldn't connect</h2><p class="faint">Check your connection, and that Anonymous sign-in is enabled in Firebase. Then refresh.</p></div>`;
  }
})();
</script>
</body>
</html>
