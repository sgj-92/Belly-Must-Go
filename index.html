async function readProfile(form, p, isNew) {
  const err = $("#pf-err");
  const nm = form.name.value.trim();
  if (!nm) { err.textContent = "Need a name."; return null; }
  if (state.players.some(o => o.id !== p?.id && o.name.toLowerCase() === nm.toLowerCase())) { err.textContent = "Someone already has that name."; return null; }
  const targetKg = readWeight(form, "target");
  if (targetKg != null && (targetKg < 30 || targetKg > 350)) { err.textContent = "That target weight doesn't look right."; return null; }
  let startKg = null;
  if (isNew) {
    startKg = readWeight(form, "start");
    if (startKg == null || startKg < 30 || startKg > 350) { err.textContent = "Pop in a starting weight so you're on the board."; return null; }
  }
  const pin = form.pin.value.trim();
  if (pin && !/^\d{4}$/.test(pin)) { err.textContent = "PIN must be 4 digits."; return null; }
  const id = p?.id || (nm.toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 12) || "p") + "-" + uid().slice(0, 5);
  let pinHash = p?.pinHash ?? null;
  if (form.clearPin?.checked) pinHash = null;
  if (pin) pinHash = await sha256(`${id}:${pin}`);
  return {
    player: { id, name: nm, emoji: form.emoji.value || "🎾", targetKg: targetKg == null ? null : targetKg, showWeight: form.showWeight.checked, pinHash, created: p?.created || today(), ts: p?.ts || Date.now() },
    startKg
  };
}

function openJoin() {
  openSheet(`<h2>Join the squad</h2><p class="lead">Your starting weight is your baseline. Everyone's ranked on % lost, so size doesn't matter.</p>${profileForm(null, true)}`, body => {
    $("#pf", body).addEventListener("submit", async e => {
      e.preventDefault();
      const res = await readProfile(e.target, null, true); if (!res) return;
      const ok = await safe(store.savePlayer(res.player));
      if (!ok) return;
      await safe(store.saveWeighin({ id: `${res.player.id}_${today()}`, pid: res.player.id, date: today(), kg: res.startKg, ts: Date.now() }));
      meId = res.player.id; prefs.set(ME_KEY, meId); spectator = false;
      closeSheet(); toast(`Welcome, ${res.player.name}. Belly must go. 🎾`); render();
    });
  }, { locked: true });
}

function openEditProfile() {
  const p = me(); if (!p) return;
  openSheet(`<h2>Edit profile</h2><p class="lead">Changes show for everyone straight away.</p>${profileForm(p, false)}`, body => {
    $("#pf", body).addEventListener("submit", async e => {
      e.preventDefault();
      const res = await readProfile(e.target, p, false); if (!res) return;
      if (await safe(store.savePlayer(res.player), "Profile saved")) closeSheet();
    });
  });
}

function pickMe(id) {
  const p = player(id); if (!p) return;
  const done = () => { meId = id; prefs.set(ME_KEY, id); spectator = false; closeSheet(); toast(`Hi ${p.name} 👋`); render(); };
  if (!p.pinHash) return done();
  openSheet(`<h2>${esc(p.emoji)} ${name(p)}</h2><p class="lead">Enter your PIN.</p>
    <form id="pinf"><div class="field"><input class="big" type="password" name="pin" inputmode="numeric" maxlength="4" autofocus></div><p class="err" id="pin-err"></p>
    <div class="btn-row"><button class="btn" type="button" data-act="who">Back</button><button class="btn primary" type="submit">Unlock</button></div></form>`, body => {
    $("#pinf", body).addEventListener("submit", async e => {
      e.preventDefault();
      if (await sha256(`${id}:${e.target.pin.value.trim()}`) === p.pinHash) done();
      else { $("#pin-err").textContent = "Wrong PIN."; e.target.pin.value = ""; }
    });
  }, { locked: true });
}

function openLogChooser() {
  if (!me()) { openWho(); return; }
  openSheet(`<h2>Log it</h2><p class="lead">What are we adding?</p>
    <div class="choice"><button data-act="log-weight"><span>⚖️</span>Weigh-in</button><button data-act="log-steps"><span>🥾</span>Steps</button></div>`);
}

function openLogWeight(date = today()) {
  const m = me(); if (!m) { openWho(); return; }
  const mine = state.weighins.filter(e => e.pid === m.id).sort((a, b) => a.date < b.date ? -1 : 1);
  const existing = d => mine.find(e => e.date === d);
  const prefill = d => existing(d)?.kg ?? mine.filter(e => e.date < d).pop()?.kg ?? null;
  const formHtml = d => `<div class="field"><label for="lw-date">Date</label><input id="lw-date" type="date" name="date" value="${d}" max="${today()}"></div>
    <div class="field"><span class="lab">Weight</span><div id="lw-w">${weightInput("w", prefill(d))}</div>
    <div class="hint">${existing(d) ? "You already logged this day — saving replaces it." : "Same time, same scales, ideally first thing."}</div></div>`;
  openSheet(`<h2>⚖️ Weigh in</h2><p class="lead">Moment of truth.</p><form id="lw">${formHtml(date)}<p class="err" id="lw-err"></p>
    <div class="btn-row"><button class="btn primary" type="submit">Save weigh-in</button></div></form>`, body => {
    const f = $("#lw", body);
    f.date.addEventListener("change", () => { const d = f.date.value; if (d) { $("#lw-w").innerHTML = weightInput("w", prefill(d)); $("#lw .hint").textContent = existing(d) ? "You already logged this day — saving replaces it." : "Same time, same scales, ideally first thing."; } });
    f.addEventListener("submit", async e => {
      e.preventDefault();
      const d = f.date.value, kg = readWeight(f, "w");
      if (!d || d > today()) { $("#lw-err").textContent = "Pick a date that isn't in the future."; return; }
      if (kg == null || kg < 30 || kg > 350) { $("#lw-err").textContent = "That weight doesn't look right."; return; }
      const prev = mine.filter(x => x.date < d).pop();
      const delta = prev ? kg - prev.kg : null;
      const msg = delta == null ? "Weigh-in saved" : delta < -0.004 ? `${fmtDelta(delta)} since last time. Belly must go 🔥` : delta > 0.004 ? `${fmtDelta(delta)}… the lads will notice 🍩` : "Holding steady. Keep at it.";
      if (await safe(store.saveWeighin({ id: `${m.id}_${d}`, pid: m.id, date: d, kg, ts: Date.now() }), msg)) closeSheet();
    });
  });
}

function openLogSteps(date = today()) {
  const m = me(); if (!m) { openWho(); return; }
  const goal = state.group.stepGoal;
  const existing = d => state.steps.find(e => e.pid === m.id && e.date === d);
  openSheet(`<h2>🥾 Log steps</h2><p class="lead">Goal is <b>${fmtInt(goal)}</b> a day. Copy the number from your phone or watch.</p>
    <form id="ls"><div class="field"><label for="ls-date">Date</label><input id="ls-date" type="date" name="date" value="${date}" max="${today()}"></div>
    <div class="field"><label for="ls-n">Steps</label><input id="ls-n" class="big" type="number" inputmode="numeric" name="steps" min="0" max="150000" value="${existing(date)?.steps ?? ""}" placeholder="0">
    <div class="hint" id="ls-hint">${existing(date) ? "Already logged — saving replaces it." : "Update it as the day goes on; the latest number wins."}</div></div>
    <p class="err" id="ls-err"></p><div class="btn-row"><button class="btn primary" type="submit">Save steps</button></div></form>`, body => {
    const f = $("#ls", body);
    f.date.addEventListener("change", () => { const ex = existing(f.date.value); f.steps.value = ex?.steps ?? ""; $("#ls-hint").textContent = ex ? "Already logged — saving replaces it." : "Update it as the day goes on; the latest number wins."; });
    f.addEventListener("submit", async e => {
      e.preventDefault();
      const d = f.date.value, n = parseInt(f.steps.value, 10);
      if (!d || d > today()) { $("#ls-err").textContent = "Pick a date that isn't in the future."; return; }
      if (isNaN(n) || n < 0 || n > 150000) { $("#ls-err").textContent = "Enter a step count between 0 and 150,000."; return; }
      const msg = n >= goal * 2 ? "Double the goal. Absolute machine 🔥" : n >= goal ? "Goal smashed ✅" : `${fmtInt(goal - n)} to go. Get walking 🚶`;
      if (await safe(store.saveSteps({ id: `${m.id}_${d}`, pid: m.id, date: d, steps: n, ts: Date.now() }), msg)) closeSheet();
    });
  });
}

function openPlayer(id) {
  const p = player(id); if (!p) return;
  if (id === meId) { go("me"); return; }
  const C = compute(), x = C.stats[id];
  const seeW = canSeeWeight(p);
  openSheet(`<div class="me-top">${av(p, "lg")}<div style="flex:1;min-width:0"><h2>${name(p)}</h2><div class="me-sub">#${C.ranks.overall[id]} overall · ${x.points} Belly Points</div></div></div>
    <div class="stat-grid">
      <div class="stat"><b class="num ${tone(x.chgPct)}">${fmtPct(x.chgPct)}</b><span>Body %</span></div>
      <div class="stat"><b class="num ${tone(x.chgKg)}">${fmtDelta(x.chgKg)}</b><span>Change</span></div>
      <div class="stat"><b class="num ${tone(x.week?.pct)}">${fmtPct(x.week?.pct)}</b><span>This week</span></div>
      <div class="stat"><b class="num">${seeW ? fmtWeight(x.curKg) : "🔒"}</b><span>Current</span></div>
      <div class="stat"><b class="num">${x.goalStreak} 🔥</b><span>Step streak</span></div>
      <div class="stat"><b class="num">${fmtInt(x.stepsAvg)}</b><span>Avg steps</span></div>
    </div>
    <div class="chart" id="chartPlayer" data-pid="${esc(id)}" style="margin-top:14px"></div>
    <div class="btn-row">${meId ? `<button class="btn" data-act="compare-go" data-id="${esc(id)}">Compare with me</button>` : ""}<button class="btn" data-act="close">Close</button></div>
    <div style="margin-top:14px">${historyCard(id, false)}</div>`, () => mountCharts(C));
}

function openGroupSettings() {
  const g = state.group;
  openSheet(`<h2>Season & step goal</h2><p class="lead">These apply to the whole squad — agree it in the group chat first.</p>
    <form id="gs"><div class="field"><label for="gs-name">Group name</label><input id="gs-name" type="text" name="name" maxlength="30" value="${esc(g.name)}"></div>
    <div class="field"><label for="gs-goal">Daily step goal</label><input id="gs-goal" type="number" inputmode="numeric" name="goal" min="1000" max="50000" step="500" value="${g.stepGoal}"></div>
    <div class="field"><label for="gs-start">Season start date</label><input id="gs-start" type="date" name="start" value="${g.startDate}">
      <div class="hint">Only weigh-ins and steps from this date count. Everyone's baseline is their first weigh-in on or after it. Move it forward to start a fresh season — old entries are kept.</div></div>
    <p class="err" id="gs-err"></p><div class="btn-row"><button class="btn primary" type="submit">Save for everyone</button></div></form>`, body => {
    $("#gs", body).addEventListener("submit", async e => {
      e.preventDefault();
      const f = e.target, goal = parseInt(f.goal.value, 10);
      if (isNaN(goal) || goal < 1000 || goal > 50000) { $("#gs-err").textContent = "Step goal must be 1,000–50,000."; return; }
      if (!f.start.value) { $("#gs-err").textContent = "Pick a start date."; return; }
      if (await safe(store.saveGroup({ name: f.name.value.trim() || "Belly Must Go", stepGoal: goal, startDate: f.start.value }), "Saved for the squad")) closeSheet();
    });
  });
}

function openPointsInfo() {
  openSheet(`<h2>How Belly Points work</h2><p class="lead">Rewards losing weight <i>and</i> turning up. Weight is scored on % of your own start weight, so a 70kg and a 130kg player compete on level terms.</p>
    <ul class="rules">
      <li><span>Every 1% of body weight lost</span><b>+${POINTS.perPct}</b></li>
      <li><span>Every 1% gained back</span><b style="color:var(--bad)">−${POINTS.perPct}</b></li>
      <li><span>Each day you hit the step goal</span><b>+${POINTS.perGoalDay}</b></li>
      <li><span>Each week you weigh in at least once</span><b>+${POINTS.perWeighWeek}</b></li>
      <li><span>Biggest Loser of the week (largest % drop)</span><b>+${POINTS.perWeeklyWin}</b></li>
    </ul>
    <p class="faint" style="font-size:.82rem;margin-top:14px">Weeks run Monday–Sunday. A week's change is your last weigh-in that week against your last weigh-in before it. Arrows on the boards show movement versus 7 days ago.</p>
    <div class="btn-row"><button class="btn" data-act="close">Got it</button></div>`);
}

/* ---------------------------------------------------------------------
   Routing + events
   --------------------------------------------------------------------- */
let route = (location.hash.slice(1) || "home");
if (!["home", "boards", "trends", "me"].includes(route)) route = "home";
function go(r) { route = r; history.replaceState(null, "", "#" + r); closeSheet(); render(); window.scrollTo({ top: 0 }); }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-route],[data-act]");
  if (!t) return;
  if (t.dataset.route) { if (t.dataset.board) board = t.dataset.board; go(t.dataset.route); return; }
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case "log": openLogChooser(); break;
    case "log-weight": openLogWeight(); break;
    case "log-steps": openLogSteps(); break;
    case "player": openPlayer(id); break;
    case "board": board = t.dataset.board; render(); break;
    case "steps-range": stepsRange = t.dataset.range; render(); break;
    case "compare": compareId = id === meId || id === compareId ? null : id; render(); break;
    case "compare-go": compareId = id; showTable = false; go("trends"); break;
    case "chart-table": showTable = !showTable; render(); break;
    case "unit": unit = t.dataset.unit; prefs.set("unit", unit); render(); break;
    case "who": spectator = false; openWho(); break;
    case "pick-me": pickMe(id); break;
    case "join": openJoin(); break;
    case "spectate": spectator = true; closeSheet(); render(); break;
    case "edit-profile": openEditProfile(); break;
    case "group-settings": openGroupSettings(); break;
    case "points-info": openPointsInfo(); break;
    case "close": closeSheet(); break;
    case "feed-more": feedAll = !feedAll; render(); break;
    case "edit-weigh": openLogWeight(t.dataset.date); break;
    case "edit-steps": openLogSteps(t.dataset.date); break;
    case "del-weigh": if (confirm("Delete this weigh-in?")) safe(store.deleteWeighin(id), "Weigh-in deleted"); break;
    case "del-steps": if (confirm("Delete this step entry?")) safe(store.deleteSteps(id), "Steps deleted"); break;
    case "reset-demo": if (!LIVE && confirm("Reset the demo back to the sample crew?")) { prefs.del(ME_KEY); meId = null; spectator = false; store.reset(); } break;
  }
});

let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => state.ready && mountCharts(compute()), 150); });
// roll over to a new day if the app is left open past midnight
let lastDay = today();
document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });

(async () => {
  render();
  try {
    store = LIVE ? await makeFirestoreStore(render) : makeDemoStore(render);
  } catch (err) {
    console.error(err);
    $("#view").innerHTML = `<div class="card"><h2>Couldn't connect</h2><p class="faint">Check your connection, and that Anonymous sign-in is enabled in Firebase. Then refresh.</p></div>`;
  }
})();
</script>
</body>
